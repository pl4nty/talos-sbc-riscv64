env:
  PLATFORM: linux/riscv64
  TOOLS_PREFIX: ghcr.io/${{ github.repository_owner }}
  TOOLS: afd1ca6
  PKGS_PREFIX: ghcr.io/${{ github.repository_owner }}
  PKGS: dba5903
  IMAGE_TAG_IN: v1.12.0-alpha.2-983-gd6869ada5
  # Build only this board (a profiles/ name); empty builds all. Set it from
  # the Run workflow button; the 3A test branch defaults to licheepi-3a.
  BOARDS: ${{ inputs.boards || (github.ref_name == 'claude/project-thread-cv8ehe' && 'licheepi-3a') || '' }}

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
'on':
  push:
    branches:
      - main
      - release-*
      # test-only: LPi4A test image with the pkgs#23 kernel
      - claude/project-thread-vop532
      # test-only: LicheePi 3A test image
      - claude/project-thread-cv8ehe
    tags:
      - v*
  workflow_dispatch:
    inputs:
      boards:
        description: Board to build (a profiles/ name, e.g. licheepi-3a). Empty builds all.
        required: false
        default: ''
  pull_request:
    branches:
      - main
      - release-*
name: default
jobs:
  default:
    permissions:
      actions: read
      contents: write
      issues: read
      packages: write
      pull-requests: read
    runs-on:
      - namespace-profile-cached
    if: (!startsWith(github.head_ref, 'renovate/') && !startsWith(github.head_ref,
      'dependabot/'))
    steps:
      - name: gather-system-info
        id: system-info
        uses: kenchan0130/actions-system-info@59699597e84e80085a750998045983daa49274c4 # version: v1.4.0
        continue-on-error: true
      - name: print-system-info
        run: |
          MEMORY_GB=$((${{ steps.system-info.outputs.totalmem }}/1024/1024/1024))

          OUTPUTS=(
            "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
            "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
            "Hostname: ${{ steps.system-info.outputs.hostname }}"
            "NodeName: ${NODE_NAME}"
            "Kernel release: ${{ steps.system-info.outputs.kernel-release }}"
            "Kernel version: ${{ steps.system-info.outputs.kernel-version }}"
            "Name: ${{ steps.system-info.outputs.name }}"
            "Platform: ${{ steps.system-info.outputs.platform }}"
            "Release: ${{ steps.system-info.outputs.release }}"
            "Total memory: ${MEMORY_GB} GB"
          )

          for OUTPUT in "${OUTPUTS[@]}";do
            echo "${OUTPUT}"
          done
        continue-on-error: true
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7.0.1
      - name: Unshallow
        run: |
          git fetch --prune --unshallow
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # version: v4.3.0
      - name: Build
        if: github.event_name == 'pull_request'
        run: |
          make
      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # version: v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}
      - name: Push to registry
        if: github.event_name != 'pull_request'
        run: |
          make PUSH=true
          # a single-board overlay must not replace latest
          if [ -z "${BOARDS}" ]; then make PUSH=true TAG=latest; fi
      - name: bootloader-artifacts
        run: |
          make bootloader-artifacts
      - name: save artifacts
        # test-only: a 409 artifact-name conflict here skipped the images job on main
        continue-on-error: true
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            _out/artifacts/**
      - name: release-assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./hack/release-assets.sh _out/artifacts _out/release
      - name: save release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-bootloaders
          path: _out/release/
  images:
    permissions:
      actions: read
      contents: write
      issues: read
      packages: write
      pull-requests: read
    runs-on: ubuntu-latest
    if: (!startsWith(github.head_ref, 'renovate/') && !startsWith(github.head_ref, 'dependabot/'))
    needs:
      - default
    steps:
      - name: gather-system-info
        id: system-info
        uses: kenchan0130/actions-system-info@59699597e84e80085a750998045983daa49274c4 # version: v1.4.0
        continue-on-error: true
      - name: print-system-info
        run: |
          MEMORY_GB=$((${{ steps.system-info.outputs.totalmem }}/1024/1024/1024))

          OUTPUTS=(
            "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
            "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
            "Hostname: ${{ steps.system-info.outputs.hostname }}"
            "NodeName: ${NODE_NAME}"
            "Kernel release: ${{ steps.system-info.outputs.kernel-release }}"
            "Kernel version: ${{ steps.system-info.outputs.kernel-version }}"
            "Name: ${{ steps.system-info.outputs.name }}"
            "Platform: ${{ steps.system-info.outputs.platform }}"
            "Release: ${{ steps.system-info.outputs.release }}"
            "Total memory: ${MEMORY_GB} GB"
          )

          for OUTPUT in "${OUTPUTS[@]}";do
            echo "${OUTPUT}"
          done
        continue-on-error: true
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7.0.1
      - name: Unshallow
        run: |
          git fetch --prune --unshallow
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # version: v4.3.0
      - name: Build
        run: |
          make images
      - name: save artifacts
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            _out/*.raw.*
      # One installer per board with the overlay baked in, so talosctl upgrade
      # keeps the board's bootloader files (factory.talos.dev/installer stand-in).
      - name: installer-images
        run: |
          make installer-images
      - name: Set up crane
        if: github.event_name != 'pull_request'
        uses: imjasonh/setup-crane@v0.4
      - name: Push installers
        if: github.event_name != 'pull_request'
        run: |
          tag=$(git describe --tag --always --dirty --match 'v[0-9]*')
          for f in _out/installer-*/installer-riscv64.tar; do
            board=$(basename "$(dirname "${f}")")
            board=${board#installer-}
            crane push "${f}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/installer-${board}:${tag}"
          done
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - default
      - images
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7.0.1
      - name: Unshallow
        run: |
          git fetch --prune --unshallow
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: metal-*
          path: _out/release
          merge-multiple: true
      - name: Download bootloaders
        uses: actions/download-artifact@v4
        with:
          name: release-bootloaders
          path: _out/release
      - name: checksums
        run: |
          cd _out/release && sha256sum * > sha256sum.txt
      - name: release-notes
        run: |
          make release-notes
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # version: v3.0.3
        with:
          body_path: _out/RELEASE_NOTES.md
          draft: "true"
          files: _out/release/*
