# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-jh7110
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: opensbi-jh7110
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        tar xf u-boot.tar.gz --strip-components=1
        rm -f u-boot.tar.gz
      - |
        make starfive_visionfive2_defconfig
      - |
        # mkeficapsule needs gnutls with PKCS#11, which the tools image doesn't
        # carry, and nothing here builds EFI capsules.
        ./scripts/config --disable TOOLS_MKEFICAPSULE
        make olddefconfig
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" OPENSBI=/rootfs/artifacts/riscv64/opensbi/fw_dynamic.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/riscv64/u-boot/jh7110
        cp -v u-boot* /rootfs/artifacts/riscv64/u-boot/jh7110
finalize:
  - from: /rootfs
    to: /rootfs
