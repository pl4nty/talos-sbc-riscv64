# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
#     - https://docs.u-boot.org/en/latest/board/spacemit/k1-spl.html
#
# Built from the pinned `next` commit rather than the RC the other boards use.
# spacemit_k1_defconfig and board/spacemit/k1 arrived after 2026.07, replacing
# the bananapi-f3 target, and the MMC series below needs a newer dts/upstream
# than 2026.10-rc3 vendors.
#
# This is an M-mode SPL that initialises DDR and chain-loads OpenSBI (packed at
# 0x0, matching the generic OpenSBI default FW_TEXT_START) plus S-mode U-Boot
# from SPI NOR. The SPL image still has to be signed into an FSBL with SpacemiT's
# vendor tooling before the boot ROM will accept it - see the guide above.
#
# CONFIG_OF_LIST covers the BPI-F3 and MusePi Pro. There's no LicheePi 3A DT
# upstream, but the 3A runs the BPI-F3 one (see patch 0016).
#
# patches/ carries two in-flight series on top of the RC, plus local changes:
#   0001-0008  K3 clock tree and reset drivers, plus the K1 reset refactor they
#              build on. Groundwork only - no K3 board target exists yet, so the
#              K3 halves aren't selected by spacemit_k1_defconfig.
#              https://patchwork.ozlabs.org/series/520080/
#   0009-0015  SD/eMMC boot for the K1 SPL. The RC can only load U-Boot proper
#              from SPI NOR; this adds the sdhci driver, boot-device selection
#              and the defconfig changes needed to boot off a card.
#              https://patchwork.ozlabs.org/series/522006/
#   0016       LicheePi 3A EEPROM name -> BPI-F3 DT, and fdtfile from the DT.
#   0017       Load U-Boot from a raw sector of eMMC boot0, not a GPT partition.
#   0018       SPL boot order: detected device, then eMMC, SD, SPI.
#   0019       Don't panic in SPL when there's no SPI NOR (LicheePi 3A).
# Drop each once it lands in a tagged release.
name: u-boot-k1
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: opensbi
  - stage: spacemit-firmware-k1
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/{{ .uboot_next_ref }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_next_sha256 }}"
        sha512: "{{ .uboot_next_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        tar xf u-boot.tar.gz --strip-components=1
        rm -f u-boot.tar.gz
      - |
        for patch in $(find /pkg/patches -type f -name "*.patch" | sort); do
          echo "Applying patch $patch"
          patch -p1 < $patch || (echo "Failed to apply patch $patch" && exit 1)
        done
      - |
        make spacemit_k1_defconfig
      - |
        # mkeficapsule needs gnutls with PKCS#11, which the tools image doesn't
        # carry, and nothing here builds EFI capsules.
        ./scripts/config --disable TOOLS_MKEFICAPSULE
      - |
        # Talos images own the eMMC user area, so the SPL reads U-Boot from
        # 1 MiB into the boot0 hardware partition, after bootinfo (0) and the
        # FSBL (0x200). See installers/licheepi-3a.
        ./scripts/config \
          --disable SYS_MMCSD_RAW_MODE_U_BOOT_USE_PARTITION \
          --enable SYS_MMCSD_RAW_MODE_U_BOOT_USE_SECTOR \
          --set-val SYS_MMCSD_RAW_MODE_U_BOOT_SECTOR 0x800 \
          --enable SUPPORT_EMMC_BOOT_OVERRIDE_PART_CONFIG \
          --set-val SYS_MMCSD_RAW_MODE_EMMC_BOOT_PARTITION 1
        # Fall back to the BPI-F3 DT when the board EEPROM can't be read: the
        # LicheePi 3A is the same design, and it's the only K1 board here.
        # Autoboot through bootstd, and set fdtfile so EFI loads the OS's DTB.
        ./scripts/config \
          --set-str DEFAULT_DEVICE_TREE spacemit/k1-bananapi-f3 \
          --enable BOARD_LATE_INIT \
          --enable BOOTSTD_DEFAULTS \
          --enable USE_BOOTCOMMAND
        # Reset through SBI SRST: OpenSBI's SpacemiT P1 PMIC driver does the
        # actual reset. Without it, `reset` stops with "not supported yet".
        ./scripts/config \
          --enable SYSRESET \
          --enable SYSRESET_SBI \
          --disable SPL_SYSRESET
        make olddefconfig
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" \
          DDR_FW_FILE=/rootfs/artifacts/riscv64/spacemit-firmware/k1/ddr_fw.bin \
          OPENSBI=/rootfs/artifacts/riscv64/opensbi/fw_dynamic.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/riscv64/u-boot/k1
        cp -v u-boot* /rootfs/artifacts/riscv64/u-boot/k1
finalize:
  - from: /rootfs
    to: /rootfs
